<style>
  :root{
      --bg: #000000;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.08);

      --text: rgb(255,255,255);
      --muted: rgba(255,255,255,.65);

      /* cores da marca */
      --blue:#C1121F;
      --blue2:#8F0D17;
      --red:#C1121F;
      --red2:#8F0D17;

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 14px;
    }

    *{ box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(193,18,31,.20), transparent 55%),
        radial-gradient(900px 500px at 90% 20%, rgba(255,255,255,.05), transparent 60%),
        linear-gradient(180deg, #050505, var(--bg));
      min-height:100vh;
    }

    /* ===== MODO CLARO ===== */
    body.light{
      --bg:#f3f5f9;
      --panel: rgba(255,255,255,.92);
      --panel2: rgba(255,255,255,.82);
      --border: rgba(15, 23, 42, .18);
      --text:#0f172a;
      --muted:#475569;
      --shadow: 0 4px 10px rgba(15,23,42,.10), 0 1px 1px rgba(15,23,42,.06);
      --btnText: #fff;
      --btnShadow: 0 10px 24px rgba(15,23,42,.12);
      --soft: rgba(15,23,42,.06);
      --softHover: rgba(15,23,42,.10);
    }

    body.light{
      background: linear-gradient(180deg, #ffffff, var(--bg));
    }

    body.light .btn{ box-shadow: none; }

    body.light .input,
    body.light .select{
      background: rgba(255,255,255,.85);
      color: var(--text);
    }

    body.light table{
      background: rgba(255,255,255,.85);
    }

    body.light .input::placeholder{
      color: rgba(15,23,42,.45);
    }

    .app{
      max-width: 1600px;
      margin: 25px auto;
      padding: 0 85px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 0;
    }

    .logo{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #C1121F, rgba(255,255,255,.14));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      flex: 0 0 auto;
    }

    .title{
      display:flex;
      align-items:center;
      gap:8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing:.3px;
      min-width:0;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .accent{
      color: rgba(255,255,255,.75);
      font-weight: 500;
    }

    .title i{
      font-size:18px;
      opacity:.9;
      flex: 0 0 auto;
    }

    .subtitle{
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 6px;
      flex: 0 0 auto;
    }

    .actions{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content:flex-end;
      white-space: nowrap;
    }

    .pill strong{ color: var(--text); }

    .pill{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 13px;
    }

    .btn{
      border: 0;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #fff;
      background: linear-gradient(180deg, var(--red), var(--red2));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 2px 8px rgba(193,18,31,.35),
        0 2px 6px rgba(0,0,0,.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all .18s ease;
    }

    .btn:active{ transform: translateY(1px); }

    .iconbtn{
      width: 38px;
      height: 38px;
      display:grid;
      place-items:center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      cursor:pointer;
    }

    .iconbtn2{
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 23px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(240,190,0,.35);
      background: rgba(240,190,0,.10);
      color: rgba(240,190,0,0.88);
      cursor: pointer;
      transition: all .18s ease;
    }

    .iconbtn2:hover{
      background: rgba(240,190,0,.18);
      transform: translateY(-1px);
    }

    .iconbtn2:active{ transform: translateY(0); }

    .grid{
      display:grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
      margin-top: 16px;
      align-items: start;
    }

    body.light .card,
    body.light .topbar{
      backdrop-filter: none;
    }
body{

    .select{
      width: 180px;

      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);

      appearance: none;

      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 15px;
    }

.select{
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}
.searchRow .select{

}
.select{

    .pager{

    .page{
      width: 34px;
      height: 34px;

      place-items:center;
      border-radius: 10px;

      color: var(--muted);

      font-weight: 800;

    .page.active{

    .sideHead{
      display:flex;

    .form{

    .btnGhost{

    .logMeta{
      margin-top: 6px;

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .actions{ flex-wrap: wrap; }

    .themeToggle{
      --h: 38px;
      --w: 76px;
      --pad: 4px;
      position: relative;
      width: var(--w);
      height: var(--h);
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      box-shadow: 0 14px 34px rgba(0,0,0,.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      user-select: none;
      flex: 0 0 auto;
    }

    .themeToggle i{
      font-size: 14px;
      color: rgba(255,255,255,.75);
      z-index: 2;
    }

    body.light .themeToggle i{ color: rgba(0,0,0,.55); }

    .themeToggle input{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .pager-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1px;
      padding-top: -20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pager-info {
      color: var(--muted);
      font-size: 14px;
    }

    .pager-info strong {
      color: #fff;
    }

    body.light .pager-info strong{
      color: var(--text);
    }

    .total {
      margin-left: 6px;
      font-size: 13px;
      opacity: .7;
    }

    .pager {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page {
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);

      font-weight: 600;

      transition: all .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.light .page{
      color: var(--text);
    }

    .page:hover:not(:disabled) {
      background: rgba(193,18,31,.25);
      transform: translateY(-2px);
    }

    .page:disabled {
      opacity: .4;
      cursor: not-allowed;

    .credit{
      margin-top: 14px;

      border-top: 1px solid var(--border);

    }

    body.light .credit strong{

    .dots {
      padding: 0 6px;
      opacity: .6;
    }

    .themeToggle .knob{
      position:absolute;
      top: var(--pad);
      left: var(--pad);
      width: calc(var(--h) - (var(--pad) * 2));
      height: calc(var(--h) - (var(--pad) * 2));
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 26px rgba(0,0,0,.45);
      transition: transform .22s ease;
    }

    .themeToggle input:checked ~ .knob{
      transform: translateX(calc(var(--w) - var(--h)));
    }

    .themeToggle:hover{
      background: rgba(255,255,255,.08);
    }

      <div>
        <div class="sideTitle">Cadastre-se agora!</div>
        <div class="formHint">
          <span class="asterisk">*</span> Campos obrigatórios
        </div>
      </div>
    </div>

    <div class="form">

      <div>
        <label class="label">
          Nome <span class="asterisk">*</span>
        </label>
        <input
          class="input"
          type="text"
          placeholder="Ex.: Gustavo Santos"
          required
          pattern="[A-Za-zÀ-ÿ\s]{3,100}"
          title="Digite apenas letras e espaços."
        >
      </div>

      <div>
        <label class="label">
          Data de Nascimento <span class="asterisk">*</span>
        </label>
        <div class="inputIcon">
          <i class="fa-regular fa-calendar"></i>
          <input
            class="input"
            type="date"
            required
          >
        </div>
      </div>

      <div>
        <label class="label">
          Endereço <span class="asterisk">*</span>
        </label>
        <textarea
          class="input"
          placeholder="Rua, número, bairro, cidade - UF"
          required
          minlength="10"
        ></textarea>
      </div>

      <div>
        <label class="label">
          E-mail <span class="asterisk">*</span>
        </label>
        <input
          class="input"
          type="email"
          placeholder="exemplo@email.com"
          required
        >
      </div>

      <div>
        <label class="label">
          Telefone <span class="asterisk">*</span>
        </label>
        <input
          class="input"
          type="tel"
          placeholder="(DD) 00000-0000"
          required
          pattern="\([0-9]{2}\)\s?[0-9]{5}-[0-9]{4}"
          title="Use o formato (11) 99999-9999"
        >
      </div>

    </div>

    <div class="sideBtns">
      <button type="reset" class="btnGhost">
        Cancelar
      </button>

      <button type="submit" class="btn">
        Salvar
      </button>
    </div>

  </div>

</form>
<script>
document.getElementById("cadastroForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (this.checkValidity()) {
        alert("Cadastro realizado com sucesso!");
        window.location.href = "index.html#login";
    } else {
        this.reportValidity();
    }
});
</script>
</body>
</body>
</html>
